name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: expo-open-ota-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Go vet and test
        run: |
          env -u REDIS_HOST -u REDIS_PORT -u REDIS_PASSWORD go vet ./...
          env -u REDIS_HOST -u REDIS_PORT -u REDIS_PASSWORD go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate EOAS CLI
        working-directory: apps/eoas
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

