name: ARM runner validation
on:
  pull_request:
    paths: ['.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: ARM64 및 Docker 확인
        run: |
          test "$(uname -m)" = aarch64
          docker version
      - name: 워크플로 구문 검사
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -shellcheck= -pyflakes= .github/workflows/validate.yml .github/workflows/deploy-fiet-eks.yml
      - uses: docker/setup-buildx-action@v3
      - name: 게시 없는 ARM64 빌드 확인
        run: |
          printf 'FROM alpine:3.22\nRUN test "$(uname -m)" = aarch64\n' > "$RUNNER_TEMP/Dockerfile.arm-smoke"
          docker buildx build --platform linux/arm64 --provenance=false --load \
            --tag arm-runner-smoke:local --file "$RUNNER_TEMP/Dockerfile.arm-smoke" "$RUNNER_TEMP"
