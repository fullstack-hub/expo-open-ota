name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: expo-open-ota-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Go vet and test
        run: |
          env -u REDIS_HOST -u REDIS_PORT -u REDIS_PASSWORD go vet ./...
          env -u REDIS_HOST -u REDIS_PORT -u REDIS_PASSWORD go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate EOAS CLI
        working-directory: apps/eoas
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: self-hosted
    environment: production
    env:
      AWS_PROFILE: fullstackhub
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: "696938875922"
      ECR_REGISTRY: 696938875922.dkr.ecr.ap-northeast-2.amazonaws.com
      ECR_REPOSITORY: apps/expo-open-ota
      EC2_INSTANCE_ID: i-0d128c3b83fcc558c
      STACK_DIR: /opt/stack
    steps:
      - uses: actions/checkout@v4

      - name: Add Homebrew tools to PATH
        run: |
          for directory in /opt/homebrew/bin /usr/local/bin; do
            [ -d "$directory" ] && echo "$directory" >> "$GITHUB_PATH"
          done

      - name: Verify AWS target
        run: |
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          test "$actual_account" = "$AWS_ACCOUNT_ID"
          test "$(aws configure get region)" = "$AWS_REGION"

      - name: Configure headless ECR login
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          ecr_password=$(aws ecr get-login-password --region "$AWS_REGION")
          ecr_auth=$(printf 'AWS:%s' "$ecr_password" | base64 | tr -d '\n')
          jq -nc --arg registry "$ECR_REGISTRY" --arg auth "$ecr_auth" \
            '{auths:{($registry):{auth:$auth}}}' \
            > "$RUNNER_TEMP/docker-config/config.json"
          unset ecr_password ecr_auth

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push ARM64 image
        id: image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          image_tag="sha-${GITHUB_SHA::12}"
          image_uri="$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --tag "$image_uri" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push .
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

      - name: Deploy only ota-server through SSM
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          EXPO_APPS_JSON: ${{ secrets.EXPO_APPS_JSON }}
        run: |
          test -n "$EXPO_APPS_JSON"
          apps_json_b64=$(printf %s "$EXPO_APPS_JSON" | base64 | tr -d '\n')
          ssm_parameters=$(jq -nc --arg image "$IMAGE_URI" --arg stack "$STACK_DIR" --arg registry "$ECR_REGISTRY" --arg region "$AWS_REGION" --arg apps "$apps_json_b64" '{commands:[
            "cd " + $stack,
            "sed -i \"/^EXPO_APPS_JSON=/d; /^S3_KEY_PREFIX=/d; /^BUCKET_KEY_PREFIX=/d\" env/ota-server.env",
            "printf \"\\nEXPO_APPS_JSON=%s\\n\" \"$(printf %s \"" + $apps + "\" | base64 -d)\" >> env/ota-server.env",
            "aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry,
            "sed -i \"/^  ota-server:/,/^  [A-Za-z0-9_-][A-Za-z0-9_-]*:/ s#^    image: .*#    image: " + $image + "#\" docker-compose.yml",
            "docker compose pull ota-server",
            "docker compose up -d --wait --wait-timeout 180 ota-server",
            "docker compose ps ota-server"
          ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy expo-open-ota $GITHUB_SHA" \
            --parameters "$ssm_parameters" \
            --query Command.CommandId \
            --output text)
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

      - name: Verify public service
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors \
            --retry-delay 5 https://ota.fullstackhub.net/hc > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 2 https://ota.fullstackhub.net/dashboard/login > /dev/null
          curl --fail --silent --show-error \
            -H 'expo-protocol-version: 1' \
            -H 'expo-platform: ios' \
            -H 'expo-runtime-version: 1.2.0' \
            -H 'expo-channel-name: production' \
            -H 'accept: multipart/mixed,application/expo+json,application/json' \
            https://ota.fullstackhub.net/bebenote/manifest > /dev/null
          curl --fail --silent --show-error \
            -H 'expo-protocol-version: 1' \
            -H 'expo-platform: ios' \
            -H 'expo-runtime-version: 1.2.1' \
            -H 'expo-channel-name: production' \
            -H 'accept: multipart/mixed,application/expo+json,application/json' \
            https://ota.fullstackhub.net/smart-puzzle/manifest > /dev/null
