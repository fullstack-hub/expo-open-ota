name: FIET EKS 배포
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write, id-token: write}
env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 522816884990.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: apps/expo-open-ota
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::522816884990:role/fullstackhub-prod-github-actions-ecr
          aws-region: ap-northeast-2
      - name: ECR 헤드리스 인증
        run: |
          config_directory="${RUNNER_TEMP}/docker-config"
          mkdir -p "$config_directory"
          ecr_password="$(aws ecr get-login-password --region "$AWS_REGION")"
          ecr_auth="$(printf 'AWS:%s' "$ecr_password" | base64 | tr -d '\n')"
          jq -nc --arg registry "$ECR_REGISTRY" --arg auth "$ecr_auth" \
            '{auths:{($registry):{auth:$auth}}}' > "$config_directory/config.json"
          echo "DOCKER_CONFIG=$config_directory" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        with: {driver: docker}
      - name: ARM64 이미지 빌드 및 게시
        run: |
          image_tag="sha-${GITHUB_SHA::12}"
          docker buildx build --push --platform linux/arm64 --provenance=false \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag" .
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
      - name: Helm 이미지 태그 갱신
        run: |
          git pull --rebase origin main
          sed -i.bak -E "s|^  tag:.*$|  tag: ${IMAGE_TAG}|" helm/expo-open-ota/values-fiet.yaml
          rm -f helm/expo-open-ota/values-fiet.yaml.bak
          git add helm/expo-open-ota/values-fiet.yaml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "chore(배포): FIET 이미지 태그 갱신 [skip ci]"
          git push origin HEAD:main
