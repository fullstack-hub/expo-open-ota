# Default values for expo-open-ota.
# 환경별 값은 values-dev.yaml / values-stg.yaml / values-prod.yaml 에서 덮어씁니다.

replicaCount: 1

deployment:
  revisionHistoryLimit: 3

image:
  # ECR repository — deploy workflow 가 푸시하는 위치와 일치해야 함
  # (APP_NAME=juvis-ota)
  repository: 011069168921.dkr.ecr.ap-northeast-2.amazonaws.com/juvis-ota
  pullPolicy: Always
  # env: develop | staging | main | local  (환경별 values 파일에서 지정)
  env: develop
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  name: "expo-open-ota-sa"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::011069168921:role/expo-open-ota-s3-role"

# ===================================================================
# ConfigMap / Secret 주입 설정 (juvis-app 패턴)
# ===================================================================
# deployment.yaml 의 envFrom 우선순위:
#   1. configMaps.common      (조직 공통 ConfigMap, 선택)
#   2. configMaps.environment (서비스+환경별 ConfigMap, helm 이 생성)
#   3. secrets.environment    (서비스+환경별 Secret, CI 가 생성)
#   4. juvis-secret           (조직 공통 Secret, local 제외)
configMaps:
  common: ""                                # 조직 공통 ConfigMap 있다면 그 이름
  environment: "expo-open-ota-config"       # 이 chart 가 생성하는 ConfigMap 이름

secrets:
  environment: "expo-open-ota-secrets"      # 운영자가 관리하는 EKS Secret 이름 (복수, 's' 있음)
  common: "juvis-secret"                    # 조직 공통 Secret. FIET에서는 빈 값으로 덮어씀

# ConfigMap data — 환경 공통값. 환경별 values 의 configMapData 가 머지/오버라이드함.
configMapData:
  PORT: "3000"
  USE_DASHBOARD: "true"
  PROMETHEUS_ENABLED: "false"

  # 스토리지 (단일 버킷 — 모든 환경 공유, prefix 로 격리)
  STORAGE_MODE: "s3"
  S3_BUCKET_NAME: "juvis-ota"
  KEYS_STORAGE_TYPE: "local"
  AWS_REGION: "ap-northeast-2"
  # v1→v2 버킷 재배치 마이그레이션 비활성화 (기존 S3 데이터 보호).
  # 멀티앱(EXPO_APPS_JSON)에서는 코드상 자동 skip 되지만, 단일앱 경로로
  # 부팅되는 경우까지 대비해 명시적으로 꺼 둔다.
  SKIP_V1_TO_V2_BUCKET_MIGRATION: "true"
  # keysStorageType=local 이면 아래 경로에 키 파일이 있어야 함 (volume mount)
  PUBLIC_LOCAL_EXPO_KEY_PATH: ""
  PRIVATE_LOCAL_EXPO_KEY_PATH: ""

  # 캐시 (Redis — juvis 인프라 공유, 환경별 클러스터에서 자체 resolve)
  CACHE_MODE: "redis-sentinel"
  REDIS_HOST: "redis-master.infra.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_SENTINEL_ADDRS: "redis-master-sentinel.infra.svc.cluster.local:26379"
  REDIS_SENTINEL_MASTER_NAME: "mymaster"
  REDIS_USE_TLS: "false"
  # REDIS_USERNAME / REDIS_PASSWORD 는 인증 미사용 (필요 시 EKS Secret 에서 주입)

# ConfigMap/Secret 외 추가 환경변수 (선택)
env: []

# 멀티앱(EXPO_APPS_JSON)은 chart 가 아니라 CI 가 관리하는 환경별 EKS Secret
# (secrets.environment = expo-open-ota-secrets) 의 EXPO_APPS_JSON 키로 주입되며,
# 위 envFrom(secretRef) 로 컨테이너에 전달된다. 서명키가 들어가므로 평문
# values 에 두지 않는다. 각 앱 항목의 publishTokens 는 불투명 토큰 배열로
# CI Secret(OTA_PUBLISH_TOKEN)과 같은 값을 등록하며, 비우면 해당 앱은
# 읽기 전용(publish 불가)이 된다. channels(채널→브랜치 맵)는 선택. 이
# 빌드는 api.expo.dev 를 호출하지 않으므로 accessToken 은 무시된다.

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

terminationGracePeriodSeconds: 75

lifecycle:
  preStop:
    enabled: true
    command:
      - /bin/sh
      - -c
      - sleep 15

livenessProbe:
  enabled: true
  httpGet:
    path: /hc
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /hc
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  httpGet:
    path: /hc
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector:
  kubernetes.io/arch: arm64
  karpenter: enabled
  type: memory
  app: enabled

tolerations:
  - key: karpenter.sh/workload
    operator: Equal
    value: app
    effect: NoSchedule

affinity: {}

dnsConfig:
  searches:
    - infra.svc.cluster.local
  options:
    - name: ndots
      value: "1"
